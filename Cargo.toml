[package]
name = "aio-idea"
version = "2026.9.14"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
az-plugin-host = { git = "https://github.com/zjarlin/aio-platform.git", rev = "71b91cc1b693f4333d021e4b791e34c6451e104d", default-features = false }
anyhow = "1.0.99"
async-trait = { version = "0.1", optional = true }
axum = { version = "0.8.6", optional = true }
dill = "0.15.0"
dioxus = { version = "=0.7.9", default-features = false, features = ["macro", "html", "signals"], optional = true }
az-dioxus-admin-shell = { git = "https://github.com/zjarlin/dioxus-admin-workbench.git", rev = "067df8cc67a44fbed3638f4ccec3e6379af7ca9f", default-features = false, optional = true }
az-ui-components = { git = "https://github.com/zjarlin/dioxus-admin-workbench.git", rev = "067df8cc67a44fbed3638f4ccec3e6379af7ca9f", optional = true }
aio_plugin_platform_links = { package = "aio-plugin-platform-links", git = "https://github.com/org-aio/aio-plugin-platform-links.git", rev = "8be1263cd6a5e366fbe8ff2bf5a1f95580ccaa0a", optional = true }
gloo-net = { version = "0.6.0", features = ["http", "json"], optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sqlx = { version = "0.8.6", default-features = false, features = ["postgres", "runtime-tokio-rustls", "json"], optional = true }
tokio = { version = "1.47.1", features = ["fs", "macros", "net", "process", "rt-multi-thread", "sync", "time"], optional = true }
toml = { version = "0.9.5", optional = true }
aio_plugin_account = { package = "aio-plugin-account", git = "https://github.com/zjarlin/aio-plugin-account.git", rev = "b6e6c561397e60fba1a1a9832ded783b19969506", optional = true }
aio_plugin_dictionary_client = { package = "aio-plugin-dictionary-client", git = "https://github.com/zjarlin/aio-plugin-dictionary.git", rev = "35283ae2b1d78c6dd7ee23c5330106617d701f81", optional = true }
aio_plugin_dictionary_server = { package = "aio-plugin-dictionary-server", git = "https://github.com/zjarlin/aio-plugin-dictionary.git", rev = "35283ae2b1d78c6dd7ee23c5330106617d701f81", optional = true }
aio_plugin_file_client = { package = "aio-plugin-file-client", git = "https://github.com/zjarlin/aio-plugin-file.git", rev = "b8ac59ec7ce9106852e0fb4c460954a6da0bc373", optional = true }
aio_plugin_file_server = { package = "aio-plugin-file-server", git = "https://github.com/zjarlin/aio-plugin-file.git", rev = "b8ac59ec7ce9106852e0fb4c460954a6da0bc373", optional = true }
aio_plugin_marketplace_client = { package = "aio-plugin-marketplace-client", git = "https://github.com/zjarlin/aio-plugin-marketplace.git", rev = "79d1ee7bf386fd7cd55f53fd11751beb101bf03d", optional = true }
aio_plugin_marketplace_server = { package = "aio-plugin-marketplace-server", git = "https://github.com/zjarlin/aio-plugin-marketplace.git", rev = "79d1ee7bf386fd7cd55f53fd11751beb101bf03d", optional = true }
aio_plugin_settings = { package = "aio-plugin-settings", git = "https://github.com/zjarlin/aio-plugin-settings.git", rev = "9ab0d90891517769fe3bd0b14a5553724cfd744e", optional = true }
aio_plugin_identity_client = { package = "aio-plugin-identity-client", git = "https://github.com/zjarlin/aio-plugin-identity.git", rev = "8acbefd58423bb01c065b3477dc06305a11df62d", optional = true }
aio_plugin_identity_server = { package = "aio-plugin-identity-server", git = "https://github.com/zjarlin/aio-plugin-identity.git", rev = "340b5f2f3956100a32ecbbdcee5cccb6dc84c9dd", optional = true }
aio_plugin_rbac_client = { package = "aio-plugin-rbac-client", git = "https://github.com/zjarlin/aio-plugin-rbac.git", rev = "c9a03a4cc5d0072b1f739860f33b39bc9415bdae", optional = true }
aio_plugin_rbac_server = { package = "aio-plugin-rbac-server", git = "https://github.com/zjarlin/aio-plugin-rbac.git", rev = "c9a03a4cc5d0072b1f739860f33b39bc9415bdae", optional = true }
aio_plugin_tenant_client = { package = "aio-plugin-tenant-client", git = "https://github.com/zjarlin/aio-plugin-tenant.git", rev = "03b03a69c75cdf4a4eea3776a8d9a8a4a70ef827", optional = true }
aio_plugin_tenant_server = { package = "aio-plugin-tenant-server", git = "https://github.com/zjarlin/aio-plugin-tenant.git", rev = "03b03a69c75cdf4a4eea3776a8d9a8a4a70ef827", optional = true }


[features]
default = ["web"]
ui = ["dep:dioxus", "dep:az-dioxus-admin-shell", "dep:az-ui-components"]
web = ["az-plugin-host/web","ui", "dioxus/web", "dioxus/launch", "dep:gloo-net", "dep:aio_plugin_account", "dep:aio_plugin_dictionary_client", "dep:aio_plugin_file_client", "dep:aio_plugin_identity_client", "dep:aio_plugin_marketplace_client", "dep:aio_plugin_rbac_client", "dep:aio_plugin_settings", "dep:aio_plugin_tenant_client", "dep:aio_plugin_platform_links"]
desktop = ["az-plugin-host/desktop","ui", "dioxus/desktop", "dioxus/launch", "dep:gloo-net", "dep:aio_plugin_account", "dep:aio_plugin_dictionary_client", "dep:aio_plugin_file_client", "dep:aio_plugin_identity_client", "dep:aio_plugin_marketplace_client", "dep:aio_plugin_rbac_client", "dep:aio_plugin_settings", "dep:aio_plugin_tenant_client", "dep:aio_plugin_platform_links"]
server = ["az-plugin-host/server", "dep:async-trait","dep:axum", "dep:sqlx", "dep:tokio", "dep:toml", "dep:aio_plugin_dictionary_server", "dep:aio_plugin_file_server", "dep:aio_plugin_identity_server", "dep:aio_plugin_marketplace_server", "dep:aio_plugin_rbac_server", "dep:aio_plugin_tenant_server"]


[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
az-plugin-host = { git = "https://github.com/zjarlin/aio-platform.git", rev = "71b91cc1b693f4333d021e4b791e34c6451e104d", default-features = false, features = ["test-support"] }
tempfile = "3.23.0"
az-plugin-package = { git = "https://github.com/zjarlin/aio-platform.git", rev = "71b91cc1b693f4333d021e4b791e34c6451e104d" }
kuchikiki = { version = "=0.8.8-speedreader" }
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls", "stream"] }
tower-http = { version = "0.6.2", features = ["fs", "compression-gzip"] }
uuid = { version = "1.18.1", features = ["v4", "v5"] }

[patch."https://github.com/zjarlin/dioxus-admin-workbench.git"]
az-dioxus-admin-shell = { path = "lib/dioxus-admin-workbench/crates/admin-shell/dioxus" }
az-ui-components = { path = "lib/dioxus-admin-workbench/crates/ui/components" }
az-admin-shell-core = { path = "lib/dioxus-admin-workbench/crates/admin-shell/core" }
