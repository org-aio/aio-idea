[package]
name = "aio-idea"
version = "2026.9.14"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
az-plugin-core = { git = "https://github.com/org-aio/aio-platform.git", rev = "1ac1c39735a66a97f18440257f92f6bdc1defe74", default-features = false, optional = true }
az-plugin-host = { git = "https://github.com/org-aio/aio-platform.git", rev = "1ac1c39735a66a97f18440257f92f6bdc1defe74", default-features = false }
anyhow = "1.0.99"
async-trait = { version = "0.1", optional = true }
axum = { version = "0.8.6", optional = true }
dill = "0.15.0"
dioxus = { version = "=0.7.9", default-features = false, features = ["macro", "html", "signals"], optional = true }
az-dioxus-admin-shell = { git = "https://github.com/zjarlin/dioxus-admin-workbench.git", rev = "071324ed60909f755f19120dcfe3346c73f0ab5d", default-features = false, optional = true }
az-ui-components = { git = "https://github.com/zjarlin/dioxus-admin-workbench.git", rev = "071324ed60909f755f19120dcfe3346c73f0ab5d", optional = true }
gloo-net = { version = "0.6.0", features = ["http", "json"], optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sqlx = { version = "0.8.6", default-features = false, features = ["postgres", "runtime-tokio-rustls", "json"], optional = true }
tokio = { version = "1.47.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"], optional = true }
toml = { version = "0.9.5", optional = true }
tonic = { version = "0.14.6", optional = true }
aio_plugin_account = { package = "aio-plugin-account", git = "https://github.com/zjarlin/aio-plugin-account.git", rev = "3b269808471cf8e83e807769df2c09df31a61b74", optional = true }
aio_plugin_file_client = { package = "aio-plugin-file-client", git = "https://github.com/zjarlin/aio-plugin-file.git", rev = "f9ad588e9221639f99146ac012464af2438e0b9a", optional = true }
aio_plugin_file_server = { package = "aio-plugin-file-server", git = "https://github.com/zjarlin/aio-plugin-file.git", rev = "0b87eaf70c6a761af66f9aadf453c0cf7150efaa", optional = true }
aio_plugin_settings = { package = "aio-plugin-settings", git = "https://github.com/zjarlin/aio-plugin-settings.git", rev = "3aeb5f7c62a979a0843a8ab7c9c255ec4246c695", optional = true }
aio_plugin_identity_client = { package = "aio-plugin-identity-client", git = "https://github.com/zjarlin/aio-plugin-identity.git", rev = "a74d2e0531a6f3a907f6e5a4f1fa61c5cbc44f62", optional = true }
aio_plugin_identity_server = { package = "aio-plugin-identity-server", git = "https://github.com/zjarlin/aio-plugin-identity.git", rev = "9b585cb6a6f74b5fef006189ba23d8d71854d45b", optional = true }
aio_plugin_rbac_client = { package = "aio-plugin-rbac-client", git = "https://github.com/zjarlin/aio-plugin-rbac.git", rev = "0966f9235cf10cbb7fecf645f5b071dfa607900b", optional = true }
aio_plugin_rbac_server = { package = "aio-plugin-rbac-server", git = "https://github.com/zjarlin/aio-plugin-rbac.git", rev = "17689dd975f200eea33560e9b18924b487982d25", optional = true }
aio_plugin_tenant_client = { package = "aio-plugin-tenant-client", git = "https://github.com/zjarlin/aio-plugin-tenant.git", rev = "ba8a56cc4dbe07e0587ecf25982251165cbf83a4", optional = true }
aio_plugin_tenant_server = { package = "aio-plugin-tenant-server", git = "https://github.com/zjarlin/aio-plugin-tenant.git", rev = "220f676256c190b42074342d20c82da76815d1e8", optional = true }
aio_plugin_platform_links = { package = "aio-plugin-platform-links", git = "https://github.com/org-aio/aio-plugin-platform-links.git", rev = "8be1263cd6a5e366fbe8ff2bf5a1f95580ccaa0a", optional = true }
aio_plugin_device_client = { package = "aio-plugin-device-client", git = "https://github.com/org-aio/aio-plugin-device.git", rev = "5cfbf8e7e25344d5e6fe6a69a33c20d188d25129", optional = true }

aio_plugin_device_server = { package = "aio-plugin-device-server", git = "https://github.com/org-aio/aio-plugin-device.git", rev = "5cfbf8e7e25344d5e6fe6a69a33c20d188d25129", optional = true }

[features]
default = ["web"]
ui = ["dep:dioxus", "dep:az-dioxus-admin-shell", "dep:az-ui-components"]
web = ["az-plugin-host/web","ui", "dioxus/web", "dioxus/launch", "dep:gloo-net", "dep:aio_plugin_account", "dep:aio_plugin_file_client", "dep:aio_plugin_identity_client", "dep:aio_plugin_rbac_client", "dep:aio_plugin_settings", "dep:aio_plugin_tenant_client", "dep:aio_plugin_platform_links", "dep:aio_plugin_device_client"]
desktop = ["az-plugin-host/desktop","ui", "dioxus/desktop", "dioxus/launch", "dep:gloo-net", "dep:aio_plugin_account", "dep:aio_plugin_file_client", "dep:aio_plugin_identity_client", "dep:aio_plugin_rbac_client", "dep:aio_plugin_settings", "dep:aio_plugin_tenant_client", "dep:aio_plugin_platform_links", "dep:aio_plugin_device_client"]
server = ["dep:az-plugin-core", "az-plugin-host/server", "az-plugin-host/rhai", "az-plugin-host/typescript", "az-plugin-host/mcp", "az-plugin-host/grpc", "az-plugin-host/remote", "az-plugin-host/wasm", "az-plugin-host/sidecar", "dep:async-trait","dep:axum", "dep:sqlx", "dep:tokio", "dep:toml", "dep:tonic", "dep:aio_plugin_file_server", "dep:aio_plugin_identity_server", "dep:aio_plugin_rbac_server", "dep:aio_plugin_tenant_server", "dep:aio_plugin_device_server"]


[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
az-plugin-contract = { git = "https://github.com/org-aio/aio-platform.git", rev = "1ac1c39735a66a97f18440257f92f6bdc1defe74", features = ["grpc"] }
az-plugin-host = { git = "https://github.com/org-aio/aio-platform.git", rev = "1ac1c39735a66a97f18440257f92f6bdc1defe74", default-features = false, features = ["test-support"] }
tempfile = "3.23.0"
az-plugin-package = { git = "https://github.com/org-aio/aio-platform.git", rev = "1ac1c39735a66a97f18440257f92f6bdc1defe74" }
kuchikiki = { version = "=0.8.8-speedreader" }
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls", "stream"] }
tower-http = { version = "0.6.2", features = ["fs", "compression-gzip"] }
uuid = { version = "1.18.1", features = ["v4", "v5"] }

[patch."https://github.com/zjarlin/dioxus-admin-workbench.git"]
az-dioxus-admin-shell = { path = "lib/dioxus-admin-workbench/crates/admin-shell/dioxus" }
az-ui-components = { path = "lib/dioxus-admin-workbench/crates/ui/components" }
az-admin-shell-core = { path = "lib/dioxus-admin-workbench/crates/admin-shell/core" }
