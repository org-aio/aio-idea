# AIO IDEA 宿主：独立的 PostgreSQL + 进程插件监督器 + Web 宿主。
# 镜像只使用已发布的运行时镜像，不在部署机上构建；发布物由 TeamCity 产出后装入
# data/releases/<40 位 SHA>/。所有主机相关取值来自同目录 .env（唯一默认值来源）。
name: aio-idea

services:
  postgres:
    image: postgres:16-alpine
    container_name: aio-idea-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=1GB"]
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    # 只在本机回环暴露，供迁移与排障；不对局域网开放。
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"

  # 进程插件监督器是唯一持有 Docker socket 的容器。
  supervisor:
    image: mcr.microsoft.com/playwright:v1.62.0-noble
    container_name: aio-idea-supervisor
    restart: unless-stopped
    user: "0:0"
    working_dir: /opt/aio-idea/releases/${AIO_RELEASE:?}
    command: ["/opt/aio-idea/releases/${AIO_RELEASE}/aio-idea", "supervisor"]
    environment:
      AIO_PLUGIN_CACHE: /opt/aio-idea/plugin-cache
      AIO_PLUGIN_SUPERVISOR_SOCKET: /run/aio-plugin-supervisor/supervisor.sock
    env_file:
      - ./process.env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/local/bin/docker:ro
      - ./data:/opt/aio-idea
      - ./run/aio-plugin-supervisor:/run/aio-plugin-supervisor
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/aio-plugin-supervisor/supervisor.sock"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  aio-idea:
    image: mcr.microsoft.com/playwright:v1.62.0-noble
    container_name: aio-idea
    restart: unless-stopped
    # 用旧部署相同的数字 UID/GID，恢复的文件归属不用改写。
    user: "${AIO_APP_UID:?}:${AIO_APP_GID:?}"
    working_dir: /opt/aio-idea/releases/${AIO_RELEASE:?}
    command: ["/opt/aio-idea/releases/${AIO_RELEASE}/aio-idea"]
    depends_on:
      postgres:
        condition: service_healthy
    # 进程任务端点要访问本机 18080 上的网关；用 host-gateway 而不是跨 compose 网络，
    # 避免与 sub2api 所在项目产生启动顺序耦合。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      AIO_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AIO_COMPONENT_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/aio_plugin_components
      AIO_COMPONENT_HOME: /opt/aio-idea/component-storage
      AIO_RUNTIME_COMPOSITION: /opt/aio-idea/runtime-composition.json
      AIO_WEB_HOST: 0.0.0.0
      AIO_WEB_PORT: "8080"
      AIO_WEB_DIST: /opt/aio-idea/releases/${AIO_RELEASE}/web
      AIO_CONFIG: /opt/aio-idea/releases/${AIO_RELEASE}/aio.toml
      AIO_PLUGIN_CACHE: /opt/aio-idea/plugin-cache
      AIO_WORKER_STORAGE_DIR: /opt/aio-idea/worker-storage
      AIO_FILE_STORAGE_DIR: /opt/aio-idea/file-storage
      AIO_PLUGIN_CACHE_MAX_BYTES: "1073741824"
      AIO_PLUGIN_CACHE_MAX_ENTRIES: "100000"
      AIO_PLUGIN_CACHE_MAX_REVISIONS: "512"
      AIO_PLUGIN_SUPERVISOR_SOCKET: /run/aio-plugin-supervisor/supervisor.sock
      AIO_SESSION_SECURE: "1"
      AIO_PASSWORD_MIN_LENGTH: "8"
      AIO_PLUGIN_PUBLISH_ACCOUNTS: zjarlin
      AIO_PUBLIC_ORIGIN: ${AIO_PUBLIC_ORIGIN:?}
      AIO_DEVICE_TUNNEL_BIND: 0.0.0.0:8091
      AIO_DEVICE_TUNNEL_DOMAIN: ${AIO_DEVICE_TUNNEL_DOMAIN:?}
      AIO_DEVICE_TUNNEL_SCHEME: ${AIO_DEVICE_TUNNEL_SCHEME:?}
    env_file:
      # 只放数据库连接以外的凭据（bootstrap 口令、billing、delivery、进程能力）。
      - ./runtime.env
      - ./process.env
    volumes:
      - ./data:/opt/aio-idea
      - ./run/aio-plugin-supervisor:/run/aio-plugin-supervisor:ro
    ports:
      # 只让本机 Caddy 反代；内网可达性由 Caddy 的 bind + remote_ip 决定。
      - "127.0.0.1:${AIO_WEB_PORT:-3080}:8080"
      - "127.0.0.1:${AIO_DEVICE_TUNNEL_PORT:-8091}:8091"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
